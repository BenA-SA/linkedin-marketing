name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --python 3.12 ruff check .
      - run: uv run --python 3.12 ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        mcp: ["latest", "1.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: pytest (mcp SDK ${{ matrix.mcp }})
        run: |
          if [ "${{ matrix.mcp }}" = "1.x" ]; then
            uv run --python ${{ matrix.python }} --with "mcp>=1.20,<2" pytest -q
          else
            uv run --python ${{ matrix.python }} pytest -q
          fi
